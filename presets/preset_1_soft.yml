schema-version: 1.0
debug: false
ores:
  enabled: true
  global-multipliers:
    vein-size-multiplier: 0.8
    veins-per-chunk-multiplier: 0.8
  list:
    coal_ore:
      enabled: true
      material: minecraft:coal_ore
      deepslate-material: minecraft:deepslate_coal_ore
      vein-size:
        min: 8
        max: 14
      veins-per-chunk: 24
      height:
        min-y: 0
        max-y: 192
        distribution: uniform
    iron_ore:
      enabled: true
      material: minecraft:iron_ore
      deepslate-material: minecraft:deepslate_iron_ore
      vein-size:
        min: 4
        max: 8
      veins-per-chunk: 8
      height:
        min-y: -24
        max-y: 56
        distribution: triangle
    diamond_ore:
      enabled: true
      material: minecraft:diamond_ore
      deepslate-material: minecraft:deepslate_diamond_ore
      vein-size:
        min: 3
        max: 6
      veins-per-chunk: 5
      height:
        min-y: -64
        max-y: 16
        distribution: triangle
global-loot:
  enabled: true
  blacklist:
  - minecraft:enchanted_golden_apple
  - minecraft:netherite_upgrade_smithing_template
  on-detect: REPLACE_WITH_TRASH
  trash-replacement-chance: 0.5
  trash-pool:
  - item: minecraft:rotten_flesh
    weight: 40
    count:
      min: 1
      max: 4
  - item: minecraft:bone
    weight: 30
    count:
      min: 1
      max: 3
  - item: minecraft:string
    weight: 20
    count:
      min: 1
      max: 2
  - item: minecraft:dirt
    weight: 15
    count:
      min: 2
      max: 4
chests:
  minecraft:chests/desert_pyramid:
    enabled: true
    vanilla-behavior: KEEP
    limits:
    - item: minecraft:diamond
      max-per-chest: 2
      max-per-stack: 1
