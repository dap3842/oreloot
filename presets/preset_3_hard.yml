schema-version: 1.0
debug: false
ores:
  enabled: true
  global-multipliers:
    vein-size-multiplier: 0.4
    veins-per-chunk-multiplier: 0.4
  list:
    coal_ore:
      enabled: true
      material: minecraft:coal_ore
      deepslate-material: minecraft:deepslate_coal_ore
      vein-size:
        min: 4
        max: 8
      veins-per-chunk: 12
      height:
        min-y: 0
        max-y: 128
        distribution: uniform
    iron_ore:
      enabled: true
      material: minecraft:iron_ore
      deepslate-material: minecraft:deepslate_iron_ore
      vein-size:
        min: 2
        max: 4
      veins-per-chunk: 4
      height:
        min-y: -32
        max-y: 48
        distribution: triangle
    gold_ore:
      enabled: true
      material: minecraft:gold_ore
      deepslate-material: minecraft:deepslate_gold_ore
      vein-size:
        min: 2
        max: 4
      veins-per-chunk: 2
      height:
        min-y: -64
        max-y: 0
        distribution: triangle
    diamond_ore:
      enabled: true
      material: minecraft:diamond_ore
      deepslate-material: minecraft:deepslate_diamond_ore
      vein-size:
        min: 1
        max: 3
      veins-per-chunk: 2
      height:
        min-y: -64
        max-y: -32
        distribution: triangle
    ancient_debris:
      enabled: true
      material: minecraft:ancient_debris
      vein-size:
        min: 1
        max: 1
      veins-per-chunk: 1
      height:
        min-y: 8
        max-y: 32
        distribution: uniform
global-loot:
  enabled: true
  blacklist:
  - minecraft:enchanted_golden_apple
  - minecraft:golden_apple
  - minecraft:diamond_sword
  - minecraft:diamond_pickaxe
  - minecraft:diamond_axe
  - minecraft:diamond_shovel
  - minecraft:diamond_hoe
  - minecraft:diamond_helmet
  - minecraft:diamond_chestplate
  - minecraft:diamond_leggings
  - minecraft:diamond_boots
  - minecraft:trident
  - minecraft:heavy_core
  - minecraft:saddle
  - minecraft:diamond_horse_armor
  - minecraft:golden_horse_armor
  - minecraft:netherite_scrap
  - minecraft:netherite_ingot
  on-detect: REPLACE_WITH_TRASH
  trash-replacement-chance: 0.85
  trash-pool:
  - item: minecraft:rotten_flesh
    weight: 40
    count:
      min: 1
      max: 4
  - item: minecraft:bone
    weight: 30
    count:
      min: 1
      max: 3
  - item: minecraft:string
    weight: 20
    count:
      min: 1
      max: 2
  - item: minecraft:dirt
    weight: 25
    count:
      min: 2
      max: 5
  - item: minecraft:cobblestone
    weight: 25
    count:
      min: 2
      max: 4
  - item: minecraft:poisonous_potato
    weight: 15
    count:
      min: 1
      max: 2
chests:
  minecraft:chests/ancient_city:
    enabled: true
    vanilla-behavior: KEEP
    limits:
    - item: minecraft:echo_shard
      max-per-chest: 1
      max-per-stack: 1
