schema-version: 1.0
debug: false
ores:
  enabled: true
  global-multipliers:
    vein-size-multiplier: 0.3
    veins-per-chunk-multiplier: 0.3
  list:
    coal_ore:
      enabled: true
      material: minecraft:coal_ore
      deepslate-material: minecraft:deepslate_coal_ore
      vein-size:
        min: 3
        max: 6
      veins-per-chunk: 8
      height:
        min-y: 0
        max-y: 128
        distribution: uniform
    iron_ore:
      enabled: true
      material: minecraft:iron_ore
      deepslate-material: minecraft:deepslate_iron_ore
      vein-size:
        min: 1
        max: 3
      veins-per-chunk: 2
      height:
        min-y: -24
        max-y: 32
        distribution: triangle
    gold_ore:
      enabled: true
      material: minecraft:gold_ore
      deepslate-material: minecraft:deepslate_gold_ore
      vein-size:
        min: 1
        max: 2
      veins-per-chunk: 1
      height:
        min-y: -64
        max-y: -16
        distribution: triangle
    diamond_ore:
      enabled: true
      material: minecraft:diamond_ore
      deepslate-material: minecraft:deepslate_diamond_ore
      vein-size:
        min: 1
        max: 2
      veins-per-chunk: 1
      height:
        min-y: -64
        max-y: -48
        distribution: triangle
    ancient_debris:
      enabled: false
      material: minecraft:ancient_debris
      vein-size:
        min: 1
        max: 1
      veins-per-chunk: 0
      height:
        min-y: 8
        max-y: 24
        distribution: uniform
global-loot:
  enabled: true
  blacklist:
  - minecraft:diamond
  - minecraft:diamond_block
  - minecraft:diamond_sword
  - minecraft:diamond_pickaxe
  - minecraft:diamond_axe
  - minecraft:diamond_shovel
  - minecraft:diamond_hoe
  - minecraft:diamond_helmet
  - minecraft:diamond_chestplate
  - minecraft:diamond_leggings
  - minecraft:diamond_boots
  - minecraft:netherite_ingot
  - minecraft:netherite_scrap
  - minecraft:netherite_upgrade_smithing_template
  - minecraft:emerald
  - minecraft:emerald_block
  - minecraft:ender_pearl
  - minecraft:totem_of_undying
  - minecraft:golden_apple
  - minecraft:enchanted_golden_apple
  - minecraft:iron_ingot
  - minecraft:gold_ingot
  on-detect: REPLACE_WITH_TRASH
  trash-replacement-chance: 0.95
  trash-pool:
  - item: minecraft:rotten_flesh
    weight: 50
    count:
      min: 1
      max: 4
  - item: minecraft:bone
    weight: 35
    count:
      min: 1
      max: 3
  - item: minecraft:string
    weight: 25
    count:
      min: 1
      max: 2
  - item: minecraft:dirt
    weight: 30
    count:
      min: 2
      max: 6
  - item: minecraft:cobblestone
    weight: 25
    count:
      min: 2
      max: 5
  - item: minecraft:stick
    weight: 25
    count:
      min: 1
      max: 4
  - item: minecraft:poisonous_potato
    weight: 20
    count:
      min: 1
      max: 2
chests: {}
enchantments:
  enabled: true
  disable-all-book-enchantments: false
  mode: WHITELIST
  whitelist:
  - minecraft:bane_of_arthropods
  - minecraft:knockback
  - minecraft:projectile_protection
  - minecraft:unbreaking
  replacements:
  - from: minecraft:mending
    to: TRASH_POOL
    chance: 1.0
  - from: minecraft:sharpness
    to: TRASH_POOL
    chance: 1.0
  - from: minecraft:protection
    to: TRASH_POOL
    chance: 1.0
  - from: minecraft:efficiency
    to: TRASH_POOL
    chance: 1.0
  trash-pool:
  - enchantment: minecraft:bane_of_arthropods
    weight: 30
  - enchantment: minecraft:smite
    weight: 25
  - enchantment: minecraft:knockback
    weight: 20
  - enchantment: minecraft:punch
    weight: 20
  - enchantment: minecraft:fire_protection
    weight: 20
  - enchantment: minecraft:blast_protection
    weight: 20
  - enchantment: minecraft:projectile_protection
    weight: 20
