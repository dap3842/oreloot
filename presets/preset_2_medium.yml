schema-version: 1.0
debug: false
ores:
  enabled: true
  global-multipliers:
    vein-size-multiplier: 0.6
    veins-per-chunk-multiplier: 0.6
  list:
    coal_ore:
      enabled: true
      material: minecraft:coal_ore
      deepslate-material: minecraft:deepslate_coal_ore
      vein-size:
        min: 6
        max: 12
      veins-per-chunk: 18
      height:
        min-y: 0
        max-y: 192
        distribution: uniform
    iron_ore:
      enabled: true
      material: minecraft:iron_ore
      deepslate-material: minecraft:deepslate_iron_ore
      vein-size:
        min: 3
        max: 6
      veins-per-chunk: 6
      height:
        min-y: -24
        max-y: 56
        distribution: triangle
    diamond_ore:
      enabled: true
      material: minecraft:diamond_ore
      deepslate-material: minecraft:deepslate_diamond_ore
      vein-size:
        min: 2
        max: 4
      veins-per-chunk: 3
      height:
        min-y: -64
        max-y: -16
        distribution: triangle
global-loot:
  enabled: true
  blacklist:
  - minecraft:enchanted_golden_apple
  - minecraft:golden_apple
  - minecraft:diamond_sword
  - minecraft:diamond_pickaxe
  - minecraft:diamond_chestplate
  - minecraft:silence_armor_trim_smithing_template
  - minecraft:netherite_upgrade_smithing_template
  on-detect: REPLACE_WITH_TRASH
  trash-replacement-chance: 0.7
  trash-pool:
  - item: minecraft:rotten_flesh
    weight: 40
    count:
      min: 1
      max: 4
  - item: minecraft:bone
    weight: 30
    count:
      min: 1
      max: 3
  - item: minecraft:string
    weight: 20
    count:
      min: 1
      max: 2
  - item: minecraft:dirt
    weight: 20
    count:
      min: 2
      max: 6
  - item: minecraft:stick
    weight: 20
    count:
      min: 1
      max: 4
chests:
  minecraft:chests/abandoned_mineshaft:
    enabled: true
    vanilla-behavior: KEEP
    limits:
    - item: minecraft:iron_ingot
      max-per-chest: 3
      max-per-stack: 2
enchantments:
  enabled: true
  disable-all-book-enchantments: false
  mode: WHITELIST
  whitelist:
  - minecraft:riptide
  - minecraft:channeling
  - minecraft:frost_walker
  - minecraft:smite
  - minecraft:bane_of_arthropods
  - minecraft:multishot
  - minecraft:knockback
  - minecraft:punch
  - minecraft:blast_protection
  - minecraft:fire_protection
  - minecraft:projectile_protection
  - minecraft:feather_falling
  - minecraft:luck_of_the_sea
  - minecraft:efficiency
  - minecraft:quick_charge
  - minecraft:lure
  - minecraft:respiration
  - minecraft:aqua_affinity
  - minecraft:soul_speed
  - minecraft:depth_strider
  - minecraft:loyalty
  - minecraft:unbreaking
  replacements:
  - from: minecraft:mending
    to: minecraft:unbreaking
    chance: 1.0
  - from: minecraft:sharpness
    to: TRASH_POOL
    chance: 1.0
  - from: minecraft:protection
    to: TRASH_POOL
    chance: 1.0
  - from: minecraft:looting
    to: TRASH_POOL
    chance: 0.9
  - from: minecraft:fortune
    to: TRASH_POOL
    chance: 0.9
  trash-pool:
  - enchantment: minecraft:bane_of_arthropods
    weight: 30
  - enchantment: minecraft:smite
    weight: 25
  - enchantment: minecraft:knockback
    weight: 20
  - enchantment: minecraft:punch
    weight: 20
  - enchantment: minecraft:fire_protection
    weight: 20
  - enchantment: minecraft:blast_protection
    weight: 20
  - enchantment: minecraft:projectile_protection
    weight: 20
